name: release

# Windows half of the release pipeline. macOS is built, signed,
# notarized, and uploaded LOCALLY by scripts/release-macos.sh (Apple
# credentials never leave the release Mac's keychain), which creates the
# draft GitHub Release and then pushes the v*.*.* tag. This job builds the
# (unsigned) Windows installers and attaches them to that same draft:
# tauri-action with releaseDraft: true looks up an existing draft by tag
# name and reuses it instead of creating a duplicate. If the tag is pushed
# by hand, this job creates the draft and the macOS script uploads into it.
#
# To cut a release (see docs/signing-macos.md):
#   npm run release:mac -- <version> --bump --publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build Windows installers for (e.g. v0.2.0)."
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows builds are unsigned; see docs/signing-windows.md.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Excalidraw Desktop ${{ github.event.inputs.tag || github.ref_name }}"
          # Only used if this job creates the draft first; keep in sync with
          # RELEASE_BODY in scripts/release-macos.sh.
          releaseBody: |
            ### Install
            - **macOS (universal: Apple Silicon + Intel):** download `Excalidraw-Desktop___VERSION___universal.dmg`, open it, and drag the app to Applications. The DMG is **signed with a Developer ID and notarized by Apple**, so it opens without Gatekeeper warnings.
            - **Windows:** download the `.msi` or `-setup.exe` installer. Windows builds are **unsigned**, so SmartScreen will warn ("More info" → "Run anyway").

            ### Logs
            The app writes a rolling log file at `~/.excalidraw-desktop/excalidraw-desktop.log` (macOS) or `%USERPROFILE%\.excalidraw-desktop\excalidraw-desktop.log` (Windows). Attach the tail when reporting issues.
          releaseDraft: true
          prerelease: false
