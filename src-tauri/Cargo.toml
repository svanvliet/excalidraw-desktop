[package]
name = "excalidraw-desktop"
version = "0.1.1"
description = "Local-first Excalidraw desktop app"
authors = ["Scott Van Vliet"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "excalidraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22.1"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-log = { version = "2", features = ["colored"] }
log = "0.4.32"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "io-std"] }
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.13", default-features = false }
mime_guess = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }

[target.'cfg(unix)'.dependencies]
# killpg/getpwuid for agent process-tree teardown and login-shell discovery.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects (kill-on-close) for agent process-tree teardown.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["signal"] }

